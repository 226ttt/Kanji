<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JLPT N5, N4 & N3 Offline Flashcard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8fafc;
            touch-action: manipulation;
        }
        
        .jp-text {
            font-family: 'Noto Sans JP', sans-serif;
        }

        .btn-press { transition: all 0.1s; }
        .btn-press:active { transform: scale(0.95); }

        .flashcard {
            min-height: 280px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen pb-10 flex flex-col">

    <div class="max-w-md w-full mx-auto px-4 py-6 flex-grow flex flex-col">
        <!-- Header -->
        <header class="text-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-layer-group text-indigo-500 mr-2"></i> คลังศัพท์ JLPT</h1>
            <p class="text-gray-500 text-sm mt-1">N5, N4 และ N3 (ออฟไลน์) รวมกว่า 600 คำ</p>
        </header>

        <!-- Level Switcher (Tabs) -->
        <div class="flex justify-center gap-1 mb-6 bg-white p-1.5 rounded-full shadow-sm border border-gray-100 overflow-x-auto">
            <button id="btnN5" onclick="switchLevel('N5')" class="flex-1 min-w-[80px] py-2 rounded-full font-bold bg-indigo-600 text-white shadow-md transition-all text-sm">
                N5
            </button>
            <button id="btnN4" onclick="switchLevel('N4')" class="flex-1 min-w-[80px] py-2 rounded-full font-bold bg-transparent text-gray-500 hover:text-gray-700 transition-all text-sm">
                N4
            </button>
            <button id="btnN3" onclick="switchLevel('N3')" class="flex-1 min-w-[80px] py-2 rounded-full font-bold bg-transparent text-gray-500 hover:text-gray-700 transition-all text-sm">
                N3 (ใหม่)
            </button>
        </div>

        <!-- Dropdown เลือกคำศัพท์ -->
        <div class="mb-6 relative">
            <div class="relative">
                <select id="wordSelect" onchange="selectWord(this.value)" class="block w-full pl-4 pr-10 py-3 text-base border-2 border-gray-200 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-xl appearance-none bg-white font-medium text-gray-700 shadow-sm">
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
            <div class="text-right mt-2">
                <span class="text-xs text-gray-500" id="wordCount">...</span>
            </div>
        </div>

        <!-- Flashcard Area -->
        <div class="flashcard bg-white rounded-3xl shadow-lg border border-gray-100 p-8 mb-6 flex-grow flex flex-col items-center justify-center relative overflow-hidden text-center cursor-pointer select-none" onclick="toggleDetails()">
            
            <div class="z-10 w-full mb-4">
                <h2 id="mainWordDisplay" class="text-6xl md:text-7xl font-bold text-gray-800 jp-text tracking-widest">...</h2>
            </div>

            <div id="detailsArea" class="z-10 w-full mt-4 flex flex-col items-center transition-opacity duration-300">
                <div class="bg-indigo-50 rounded-xl py-2 px-6 inline-block mb-3">
                    <p class="text-xs text-indigo-400 mb-1">คำอ่าน</p>
                    <p id="kanaDisplay" class="text-2xl font-medium text-indigo-700 jp-text">...</p>
                </div>
                
                <p class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-1 mt-2">ความหมาย</p>
                <h3 id="meaningDisplay" class="text-2xl font-bold text-gray-800">...</h3>
            </div>

            <div id="hintText" class="absolute bottom-4 text-xs text-gray-400 bg-gray-50 px-3 py-1 rounded-full hidden">
                <i class="fas fa-hand-pointer mr-1"></i> แตะที่การ์ดเพื่อแสดง/ซ่อนคำแปล
            </div>
        </div>

        <!-- Toggles ควบคุมการซ่อน/แสดง -->
        <div class="flex flex-row gap-4 mb-6 justify-center bg-white py-3 px-4 rounded-2xl shadow-sm border border-gray-100">
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="autoShowDetails" checked onchange="toggleAutoShow()" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
                <span class="text-sm font-medium text-gray-700">แสดงคำแปลอัตโนมัติ</span>
            </label>
        </div>

        <!-- Controls (Navigation) -->
        <div class="flex justify-between items-center gap-3">
            <button onclick="prevWord()" class="btn-press flex-1 bg-white hover:bg-gray-50 text-gray-700 border-2 border-gray-200 font-semibold py-4 px-4 rounded-xl flex items-center justify-center shadow-sm">
                <i class="fas fa-arrow-left mr-2"></i> ก่อนหน้า
            </button>
            <button onclick="randomWord()" class="btn-press w-14 h-14 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl flex items-center justify-center shadow-md shadow-indigo-200">
                <i class="fas fa-random text-xl"></i>
            </button>
            <button onclick="nextWord()" class="btn-press flex-1 bg-white hover:bg-gray-50 text-gray-700 border-2 border-gray-200 font-semibold py-4 px-4 rounded-xl flex items-center justify-center shadow-sm">
                ถัดไป <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

            { type: "คุณศัพท์ (N3)", kanji: "深い", kana: "ふかい", meaning: "ลึก" },
            { type: "คุณศัพท์ (N3)", kanji: "浅い", kana: "あさい", meaning: "ตื้น" },
            { type: "คุณศัพท์ (N3)", kanji: "太い", kana: "ふとい", meaning: "อ้วน, หนา" },
            { type: "คุณศัพท์ (N3)", kanji: "細い", kana: "ほそい", meaning: "ผอม, เรียว" },
            { type: "คุณศัพท์ (N3)", kanji: "硬い", kana: "かたい", meaning: "แข็ง" },
            { type: "คุณศัพท์ (N3)", kanji: "柔らかい", kana: "やわらかい", meaning: "นุ่ม" },
            { type: "คุณศัพท์ (N3)", kanji: "細かい", kana: "こまかい", meaning: "ละเอียด, ยิบย่อย" },
            { type: "คุณศัพท์ (N3)", kanji: "濃い", kana: "こい", meaning: "เข้ม, ข้น" },
            { type: "คุณศัพท์ (N3)", kanji: "薄い", kana: "うすい", meaning: "บาง, อ่อน" },
            { type: "คุณศัพท์ (N3)", kanji: "温かい", kana: "あたたかい", meaning: "อบอุ่น" },
            { type: "คุณศัพท์ (N3)", kanji: "涼しい", kana: "すずしい", meaning: "เย็นสบาย" },
            { type: "คุณศัพท์ (N3)", kanji: "珍しい", kana: "めずらしい", meaning: "แปลก, หายาก" },
            { type: "คุณศัพท์ (N3)", kanji: "正しい", kana: "ただしい", meaning: "ถูกต้อง" },

            { type: "คุณศัพท์ (N3)", kanji: "確かな", kana: "たしかな", meaning: "แน่นอน, เชื่อถือได้" },
            { type: "คุณศัพท์ (N3)", kanji: "丁寧な", kana: "ていねいな", meaning: "สุภาพ, ประณีต" },
            { type: "คุณศัพท์ (N3)", kanji: "適当な", kana: "てきとうな", meaning: "เหมาะสม, ตามเรื่องตามราว" },
            { type: "คุณศัพท์ (N3)", kanji: "特別な", kana: "とくべつな", meaning: "พิเศษ" },
            { type: "คุณศัพท์ (N3)", kanji: "完全な", kana: "かんぜんな", meaning: "สมบูรณ์แบบ" },
            { type: "คุณศัพท์ (N3)", kanji: "盛んな", kana: "さかんな", meaning: "เจริญรุ่งเรือง, เป็นที่นิยม" },
            { type: "คุณศัพท์ (N3)", kanji: "様々な", kana: "さまざまな", meaning: "หลากหลาย" },
            { type: "คุณศัพท์ (N3)", kanji: "色々な", kana: "いろいろな", meaning: "ต่างๆ นาๆ" },
            { type: "คุณศัพท์ (N3)", kanji: "一生懸命", kana: "いっしょうけんめい", meaning: "พยายามอย่างเต็มที่" },
            { type: "คุณศัพท์ (N3)", kanji: "偶然", kana: "ぐうぜん", meaning: "บังเอิญ" },

            { type: "คุณศัพท์ (N3)", kanji: "突然", kana: "とつぜん", meaning: "กะทันหัน" },
            { type: "คุณศัพท์ (N3)", kanji: "急に", kana: "きゅうに", meaning: "จู่ๆ ก็" },
            { type: "คุณศัพท์ (N3)", kanji: "絶対", kana: "ぜったい", meaning: "แน่นอน" },
            { type: "คุณศัพท์ (N3)", kanji: "是非", kana: "ぜひ", meaning: "ให้ได้ (ใช้กับความต้องการ)" },
            { type: "คุณศัพท์ (N3)", kanji: "必ず", kana: "かならず", meaning: "แน่ๆ, ไม่พลาด" },
            { type: "คุณศัพท์ (N3)", kanji: "きっと", kana: "きっと", meaning: "แน่ๆ (คาดการณ์)" },
            { type: "คุณศัพท์ (N3)", kanji: "多分", kana: "たぶん", meaning: "บางที, อาจจะ" },
            { type: "คุณศัพท์ (N3)", kanji: "例えば", kana: "たとえば", meaning: "ตัวอย่างเช่น" },
            { type: "คุณศัพท์ (N3)", kanji: "もし", kana: "もし", meaning: "ถ้าหากว่า" },
            { type: "คุณศัพท์ (N3)", kanji: "いくら", kana: "いくら", meaning: "ต่อให้...แค่ไหนก็ตาม" },
            { type: "คุณศัพท์ (N3)", kanji: "やはり", kana: "やはり", meaning: "อย่างที่คิดไว้, ว่าแล้วเชียว" }
        ];

        // ---------------------------------
        // ระบบควบคุม
        // ---------------------------------
        let currentLevel = 'N5';
        let activeData = n5Data; // เริ่มต้นที่ N5
        let currentIndex = 0;
        let isDetailsVisible = true;
        let autoShow = true;

        // สลับแท็บระดับ JLPT
        function switchLevel(level) {
            currentLevel = level;
            
            const btnN5 = document.getElementById('btnN5');
            const btnN4 = document.getElementById('btnN4');
            const btnN3 = document.getElementById('btnN3');

            // รีเซ็ตปุ่มทั้งหมดเป็นสีเทา
            const inactiveClass = "flex-1 min-w-[80px] py-2 rounded-full font-bold bg-transparent text-gray-500 hover:text-gray-700 transition-all text-sm";
            const activeClass = "flex-1 min-w-[80px] py-2 rounded-full font-bold bg-indigo-600 text-white shadow-md transition-all text-sm";

            btnN5.className = inactiveClass;
            btnN4.className = inactiveClass;
            btnN3.className = inactiveClass;

            // ตั้งค่า Active สีน้ำเงินให้แท็บที่เลือก
            if (level === 'N5') {
                activeData = n5Data;
                btnN5.className = activeClass;
            } else if (level === 'N4') {
                activeData = n4Data;
                btnN4.className = activeClass;
            } else if (level === 'N3') {
                activeData = n3Data;
                btnN3.className = activeClass;
            }

            currentIndex = 0;
            initDropdown();
            loadWordData(currentIndex);
        }

        // โหลดข้อมูลใส่ Dropdown ตามหมวดที่เลือก
        function initDropdown() {
            const select = document.getElementById('wordSelect');
            select.innerHTML = '';
            let currentGroup = '';
            let optgroup = null;

            activeData.forEach((item, index) => {
                if (item.type !== currentGroup) {
                    currentGroup = item.type;
                    optgroup = document.createElement('optgroup');
                    optgroup.label = `--- หมวด${currentGroup} ---`;
                    select.appendChild(optgroup);
                }
                const option = document.createElement('option');
                option.value = index;
                const displayWord = item.kanji ? item.kanji : item.kana;
                option.text = `${displayWord} (${item.meaning})`;
                optgroup.appendChild(option);
            });

            document.getElementById('wordCount').innerText = `คลังศัพท์ ${currentLevel} ทั้งหมด ${activeData.length} คำ`;
        }

        // เปิด/ปิด การแสดงผลอัตโนมัติ
        function toggleAutoShow() {
            autoShow = document.getElementById('autoShowDetails').checked;
            if (autoShow) {
                isDetailsVisible = true;
                updateDetailsVisibility();
            } else {
                isDetailsVisible = false;
                updateDetailsVisibility();
            }
        }

        // เมื่อกดที่การ์ด ให้ซ่อนหรือแสดงคำแปล
        function toggleDetails() {
            isDetailsVisible = !isDetailsVisible;
            updateDetailsVisibility();
        }

        function updateDetailsVisibility() {
            const detailsArea = document.getElementById('detailsArea');
            const hintText = document.getElementById('hintText');
            
            if (isDetailsVisible) {
                detailsArea.style.opacity = '1';
                detailsArea.style.visibility = 'visible';
                hintText.classList.add('hidden');
            } else {
                detailsArea.style.opacity = '0';
                // หน่วงเวลาซ่อนให้แอนิเมชัน opacity ทำงานก่อน
                setTimeout(() => {
                    if(!isDetailsVisible) detailsArea.style.visibility = 'hidden';
                }, 300);
                hintText.classList.remove('hidden');
            }
        }

        function loadWordData(index) {
            const word = activeData[index];
            const mainDisplay = word.kanji || word.kana;
            
            // อัปเดตข้อมูลบนหน้าจอ
            document.getElementById('mainWordDisplay').innerText = mainDisplay;
            document.getElementById('meaningDisplay').innerText = word.meaning;
            document.getElementById('kanaDisplay').innerText = word.kana;
            document.getElementById('wordSelect').value = index;

            // รีเซ็ตการแสดงผลตามตั้งค่า "แสดงคำแปลอัตโนมัติ"
            isDetailsVisible = autoShow;
            updateDetailsVisibility();
        }

        function selectWord(index) {
            currentIndex = parseInt(index);
            loadWordData(currentIndex);
        }

        function nextWord() {
            currentIndex = (currentIndex + 1) % activeData.length;
            loadWordData(currentIndex);
        }

        function prevWord() {
            currentIndex = (currentIndex - 1 + activeData.length) % activeData.length;
            loadWordData(currentIndex);
        }

        function randomWord() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * activeData.length);
            } while (newIndex === currentIndex && activeData.length > 1);
            currentIndex = newIndex;
            loadWordData(currentIndex);
        }

        // เริ่มต้นการทำงานเมื่อหน้าเว็บโหลดเสร็จ
        window.onload = () => {
            initDropdown();
            loadWordData(currentIndex);
        };
    </script>
